# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade, add @n8n/node-cli@latest as a dev dependency using your package manager.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# npm Trusted Publishing (OIDC). No npm token is stored anywhere:
#   1. On npmjs.com, open the package's settings.
#   2. Under "Trusted Publisher", choose GitHub Actions and fill in:
#        Organization or user: sourcey
#        Repository:           n8n-nodes-sourcey
#        Workflow filename:    publish.yml
#        Environment:          (blank)
#   3. Publishing then uses this job's GitHub OIDC token. Provenance is signed
#      by the same token.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run the following command locally to start an interactive release:
#
#   npm run release
#
# This will lint, build, prompt for a version bump, update the changelog,
# commit, tag, and push — which triggers this workflow to publish to npm.

name: Publish

on:
  workflow_dispatch:
    inputs:
      publisher_check:
        description: Validate trusted publisher authentication without publishing
        type: boolean
        default: true
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    if: ${{ github.event_name == 'push' }}
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Release
        # Publishes to npm through trusted publishing, with a provenance
        # attestation (requires id-token: write above). Lint and build run
        # automatically as part of the release process.
        run: npm run release
        env:
          NPM_CONFIG_ACCESS: public

  publisher_check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publisher_check }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - run: npm install --global npm@12.2.1
      - name: Validate repository authentication without publishing
        run: |
          log="$RUNNER_TEMP/npm-publisher-check.log"
          trap 'rm -f "$log"' EXIT
          npm dist-tag ls n8n-nodes-sourcey --loglevel=verbose > "$log" 2>&1
          if ! grep -Fq 'verbose oidc Successfully retrieved and set token' "$log"; then
            echo 'Trusted publisher authentication was not validated.' >&2
            exit 1
          fi
          echo 'Repository trusted publisher authentication validated; no package or tag was changed.'
